name: 01 · Continuous Integration

on:
  push:
    branches:
      - main
      - pattern-refactor
      - audio-module
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/badges/**'
      - '.github/entropy/state.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  posix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            os: ubuntu-latest
            cc: gcc
          - name: Linux / Clang
            os: ubuntu-latest
            cc: clang
          - name: macOS / Clang
            os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap repository
        if: ${{ hashFiles('Codespace/Tests/**') == '' }}
        run: echo "Codespace/Tests is not present yet; CI is installed and waiting for the source migration."

      - name: CLI and Parsing
        run: |
          make -C Codespace/Tests/CLI clean run CC=${{ matrix.cc }}
          make -C Codespace/Tests/Parsing clean run CC=${{ matrix.cc }}

      - name: Compression
        run: make -C Codespace/Tests/Compression clean run interop CC=${{ matrix.cc }}

      - name: Database
        run: make -C Codespace/Tests/Database clean run CC=${{ matrix.cc }}

      - name: File
        run: make -C Codespace/Tests/File clean run CC=${{ matrix.cc }}

      - name: Input
        run: make -C Codespace/Tests/Input clean run CC=${{ matrix.cc }}

      - name: Terminal
        run: make -C Codespace/Tests/Terminal clean run CC=${{ matrix.cc }}

      - name: Audio
        if: ${{ hashFiles('Codespace/Tests/Audio/**') != '' }}
        run: make -C Codespace/Tests/Audio clean run CC=${{ matrix.cc }}

      - name: Core
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        run: make -C Codespace/Tests/Core clean run CC=${{ matrix.cc }}

      - name: Bit
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        run: make -C Codespace/Tests/Bit clean run CC=${{ matrix.cc }}

      - name: Chronometry
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        run: make -C Codespace/Tests/Chronometry clean run CC=${{ matrix.cc }}

      - name: Container
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        run: make -C Codespace/Tests/Container clean strict multi-tu CC=${{ matrix.cc }}

      - name: Math
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        run: make -C Codespace/Tests/Math clean run CC=${{ matrix.cc }}

      - name: Random
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        run: make -C Codespace/Tests/Random clean run CC=${{ matrix.cc }}

      - name: Struct
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        run: make -C Codespace/Tests/Struct clean run CC=${{ matrix.cc }}

      - name: Text
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        run: make -C Codespace/Tests/Text clean run CC=${{ matrix.cc }} BUILD=build-${{ matrix.cc }}

      - name: Type
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        run: make -C Codespace/Tests/Type clean run CC=${{ matrix.cc }}

      - name: Concurrency
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        run: make -C Codespace/Tests/Concurrency clean run CC=${{ matrix.cc }} BUILD=build-${{ matrix.cc }}

      - name: Network
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        run: make -C Codespace/Tests/Network clean strict CC=${{ matrix.cc }}

      - name: Sort catalog (strict C11)
        run: |
          for src in Codespace/Tests/Sort.c Codespace/Tests/SortCatalog.c; do
            "${{ matrix.cc }}" -std=c11 -Wall -Wextra -Wpedantic -Werror -I Codespace "$src" -o sort-test
            ./sort-test
          done


  freebsd:
    name: FreeBSD / Clang / C11
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run portable, native and Input suites in FreeBSD VM
        id: tests
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          usesh: true
          run: |
            set -eu
            sh .github/scripts/test-portable-core.sh
            sh .github/scripts/test-bsd-native.sh
            sh .github/scripts/test-bsd-extended.sh
            sh .github/scripts/test-input-posix.sh
      - name: Report FreeBSD coverage
        if: ${{ always() }}
        shell: bash
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          {
            echo '### FreeBSD / C11'
            echo ''
            echo '| Suite | Result |'
            echo '|---|---|'
            echo "| Portable + native + extended + Input | $TEST_RESULT |"
            echo ''
            echo 'Tests run on a genuine FreeBSD VM through vmactions, not a Linux container.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f .build-bsd-extended/coverage.md ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            cat .build-bsd-extended/coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Extended BSD report unavailable (check VM setup logs).' >> "$GITHUB_STEP_SUMMARY"
          fi


  mingw:
    name: Windows / MinGW
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap repository
        if: ${{ hashFiles('Codespace/Tests/**') == '' }}
        shell: bash
        run: echo "Codespace/Tests is not present yet; CI is installed and waiting for the source migration."

      - name: CLI and Parsing
        shell: bash
        run: |
          make -C Codespace/Tests/CLI clean run CC=gcc
          make -C Codespace/Tests/Parsing clean run CC=gcc

      - name: Compression
        shell: bash
        run: make -C Codespace/Tests/Compression clean run interop CC=gcc

      - name: Database
        shell: bash
        run: make -C Codespace/Tests/Database clean run CC=gcc

      - name: File
        shell: bash
        run: make -C Codespace/Tests/File clean run CC=gcc

      - name: Input
        shell: bash
        run: make -C Codespace/Tests/Input clean run CC=gcc

      - name: Terminal and Canvas
        shell: bash
        run: make -C Codespace/Tests/Terminal clean run CC=gcc

      - name: Audio
        if: ${{ hashFiles('Codespace/Tests/Audio/**') != '' }}
        shell: bash
        run: make -C Codespace/Tests/Audio clean run CC=gcc

      - name: Core
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        shell: bash
        run: |
          make -C Codespace/Tests/Core clean build CC=gcc CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror"
          for t in Codespace/Tests/Core/.build/*.exe; do "$t"; done

      - name: Bit
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        shell: bash
        run: make -C Codespace/Tests/Bit clean run CC=gcc CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror"

      - name: Chronometry
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        shell: bash
        run: make -C Codespace/Tests/Chronometry clean run CC=gcc CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror"

      - name: Container
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        shell: bash
        run: make -C Codespace/Tests/Container clean strict multi-tu CC=gcc CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror"

      - name: Math
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        shell: bash
        run: make -C Codespace/Tests/Math clean run CC=gcc CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror"

      - name: Random
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        shell: bash
        run: make -C Codespace/Tests/Random clean run CC=gcc CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror"

      - name: Struct
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        shell: bash
        run: make -C Codespace/Tests/Struct clean run CC=gcc CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror"

      - name: Text
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        shell: bash
        run: make -C Codespace/Tests/Text clean run CC=gcc BUILD=build-windows CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror"

      - name: Type
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        shell: bash
        run: make -C Codespace/Tests/Type clean run CC=gcc CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror"

      - name: Concurrency
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        shell: bash
        run: |
          make -C Codespace/Tests/Concurrency clean windows WINDOWS_CC=gcc
          for t in Codespace/Tests/Concurrency/build-windows/*.exe; do "$t"; done

      - name: Network
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        shell: bash
        run: |
          make -C Codespace/Tests/Network clean windows WINDOWS_CC=gcc
          for t in Codespace/Tests/Network/build-windows/*.exe; do "$t"; done

      - name: Sort catalog (strict C11)
        shell: bash
        run: |
          for src in Codespace/Tests/Sort.c Codespace/Tests/SortCatalog.c; do
            gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -I Codespace "$src" -o sort-test.exe
            ./sort-test.exe
          done


  msvc:
    name: Windows / MSVC
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap repository
        if: ${{ hashFiles('Codespace/Tests/**') == '' }}
        shell: pwsh
        run: Write-Host "Codespace/Tests is not present yet; CI is installed and waiting for the source migration."

      - name: Set up MSVC
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile and run all suites
        if: ${{ hashFiles('Codespace/Tests/**') != '' }}
        shell: pwsh
        run: .github/scripts/test-msvc.ps1

      - name: Sort catalog (MSVC)
        shell: pwsh
        run: |
          foreach ($src in @("Codespace/Tests/Sort.c", "Codespace/Tests/SortCatalog.c")) {
            cl /nologo /W4 /WX /TC /I Codespace $src /Fe:sort-test.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\sort-test.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }


  standalone-headers:
    name: Standalone headers / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile every public header independently
        run: python3 .github/scripts/test-public-headers.py --compiler ${{ matrix.cc }}

  entropy-tests:
    name: Entropy algorithm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unit and history tests
        run: python3 .github/entropy/test_entropy.py -v

      - name: Preview current source snapshot
        run: python3 .github/entropy/entropy.py --provisional --output-dir /tmp/entropy-preview

  sanitizers:
    name: Linux / Clang / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SAN_FLAGS: -std=c11 -Wall -Wextra -Wpedantic -Werror -D_POSIX_C_SOURCE=200809L -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CLI and Parsing
        run: |
          make -C Codespace/Tests/CLI clean run CC=clang CFLAGS="$SAN_FLAGS"
          make -C Codespace/Tests/Parsing clean run CC=clang CFLAGS="$SAN_FLAGS"

      - name: Compression
        run: make -C Codespace/Tests/Compression clean run interop CC=clang CFLAGS="$SAN_FLAGS"
      - name: Database
        run: make -C Codespace/Tests/Database clean run CC=clang CFLAGS="$SAN_FLAGS"
      - name: File
        run: make -C Codespace/Tests/File clean run CC=clang CFLAGS="$SAN_FLAGS"
      - name: Input
        run: make -C Codespace/Tests/Input clean run CC=clang CFLAGS="$SAN_FLAGS"
      - name: Terminal and Canvas
        run: make -C Codespace/Tests/Terminal clean run CC=clang CFLAGS="$SAN_FLAGS"
      - name: Audio
        run: make -C Codespace/Tests/Audio clean run CC=clang CFLAGS="$SAN_FLAGS"
      - name: Core
        run: make -C Codespace/Tests/Core clean run CC=clang CFLAGS="$SAN_FLAGS"
      - name: Bit
        run: make -C Codespace/Tests/Bit clean run CC=clang CFLAGS="$SAN_FLAGS"
      - name: Chronometry
        run: make -C Codespace/Tests/Chronometry clean run CC=clang CFLAGS="$SAN_FLAGS"
      - name: Container
        run: make -C Codespace/Tests/Container clean strict multi-tu CC=clang CFLAGS="$SAN_FLAGS"
      - name: Math
        run: make -C Codespace/Tests/Math clean run CC=clang CFLAGS="$SAN_FLAGS"
      - name: Random
        run: make -C Codespace/Tests/Random clean run CC=clang CFLAGS="$SAN_FLAGS"
      - name: Struct
        run: make -C Codespace/Tests/Struct clean run CC=clang CFLAGS="$SAN_FLAGS"
      - name: Text
        run: make -C Codespace/Tests/Text clean run CC=clang BUILD=build-sanitize CFLAGS="$SAN_FLAGS"
      - name: Type
        run: make -C Codespace/Tests/Type clean run CC=clang CFLAGS="$SAN_FLAGS"
      - name: Concurrency
        run: make -C Codespace/Tests/Concurrency clean run CC=clang BUILD=build-sanitize CFLAGS="$SAN_FLAGS"
      - name: Network
        run: make -C Codespace/Tests/Network clean strict CC=clang CFLAGS="$SAN_FLAGS"

  linux-32bit:
    name: Linux / GCC / 32-bit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CFLAGS32: -m32 -std=c11 -Wall -Wextra -Wpedantic -Werror -D_POSIX_C_SOURCE=200809L

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit libc
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386

      - name: CLI and Parsing
        run: |
          make -C Codespace/Tests/CLI clean run CC=gcc CFLAGS="$CFLAGS32"
          make -C Codespace/Tests/Parsing clean run CC=gcc CFLAGS="$CFLAGS32"

      - name: Compression
        run: make -C Codespace/Tests/Compression clean run interop CC=gcc CFLAGS="$CFLAGS32"
      - name: Database
        run: make -C Codespace/Tests/Database clean run CC=gcc CFLAGS="$CFLAGS32"
      - name: File
        run: make -C Codespace/Tests/File clean run CC=gcc CFLAGS="$CFLAGS32"
      - name: Input
        run: make -C Codespace/Tests/Input clean run CC=gcc CFLAGS="$CFLAGS32"
      - name: Audio
        run: make -C Codespace/Tests/Audio clean run CC=gcc CFLAGS="$CFLAGS32"
      - name: Core
        run: make -C Codespace/Tests/Core clean run CC=gcc CFLAGS="$CFLAGS32"
      - name: Bit
        run: make -C Codespace/Tests/Bit clean run CC=gcc CFLAGS="$CFLAGS32"
      - name: Chronometry
        run: make -C Codespace/Tests/Chronometry clean run CC=gcc CFLAGS="$CFLAGS32"
      - name: Container
        run: make -C Codespace/Tests/Container clean strict multi-tu CC=gcc CFLAGS="$CFLAGS32"
      - name: Math
        run: make -C Codespace/Tests/Math clean run CC=gcc CFLAGS="$CFLAGS32"
      - name: Random
        run: make -C Codespace/Tests/Random clean run CC=gcc CFLAGS="$CFLAGS32"
      - name: Struct
        run: make -C Codespace/Tests/Struct clean run CC=gcc CFLAGS="$CFLAGS32"
      - name: Text
        run: make -C Codespace/Tests/Text clean run CC=gcc BUILD=build-32 CFLAGS="$CFLAGS32"
      - name: Type
        run: make -C Codespace/Tests/Type clean run CC=gcc CFLAGS="$CFLAGS32"
      - name: Concurrency
        run: make -C Codespace/Tests/Concurrency clean run CC=gcc BUILD=build-32 CFLAGS="$CFLAGS32"
      - name: Network
        run: make -C Codespace/Tests/Network clean strict CC=gcc CFLAGS="$CFLAGS32"

  thread-sanitizer:
    name: Linux / GCC / ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TSAN_FLAGS: -std=c11 -Wall -Wextra -Wpedantic -Werror -D_POSIX_C_SOURCE=200809L -O1 -g -fsanitize=thread -fno-omit-frame-pointer
      TSAN_OPTIONS: halt_on_error=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Concurrency under ThreadSanitizer
        run: make -C Codespace/Tests/Concurrency clean run CC=gcc BUILD=build-tsan CFLAGS="$TSAN_FLAGS"

  gate:
    name: CI / Gate
    if: ${{ always() }}
    needs:
      - posix
      - freebsd
      - mingw
      - msvc
      - standalone-headers
      - entropy-tests
      - sanitizers
      - linux-32bit
      - thread-sanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Summary and required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPORT_TITLE: Continuous Integration
        run: python3 .github/scripts/report-results.py
