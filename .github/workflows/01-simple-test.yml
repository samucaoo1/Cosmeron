name: 01 · CI

on:
  push:
    branches-ignore: ['automation/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: CI / Portable C11 / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Run manifest suites
        env:
          CC: ${{ matrix.cc }}
        run: sh .github/scripts/test-portable-core.sh

  headers:
    name: CI / Standalone headers / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Compile public headers
        run: python3 .github/scripts/test-public-headers.py --compiler ${{ matrix.cc }}

  tooling:
    name: CI / Repository tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Python syntax
        run: python3 -m py_compile .github/scripts/*.py .github/entropy/*.py .github/loc/*.py .github/cosmeron/*.py .github/tools/*.py
      - name: Shell syntax
        run: |
          set -eu
          for script in .github/scripts/*.sh .github/tools/*/*.sh; do
            [ -f "$script" ] || continue
            sh -n "$script"
          done
      - name: Entropy and badge tests
        run: |
          python3 .github/entropy/test_entropy.py -v
          python3 .github/cosmeron/test_badges.py -v

  gate:
    name: CI / Gate
    if: ${{ always() }}
    needs: [portable, headers, tooling]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPORT_TITLE: CI
        run: python3 .github/scripts/report-results.py
