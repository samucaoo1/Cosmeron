name: 02 · Platform Compatibility
on:
  push:
    branches: [main, audio-module]
    paths:
      - 'Codespace/**'
      - '.github/scripts/test-portable-core.sh'
      - '.github/scripts/test-linux-codec-minimal.sh'
      - '.github/scripts/test-bsd-native.sh'
      - '.github/scripts/test-bsd-extended.sh'
      - '.github/scripts/test-bsd-interop.sh'
      - '.github/scripts/test-input-posix.sh'
      - 'Tools/ohos/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'Tools/crostini/**'
      - '.github/workflows/02-platforms.yml'
  pull_request:
    paths:
      - 'Codespace/**'
      - '.github/scripts/test-portable-core.sh'
      - '.github/scripts/test-linux-codec-minimal.sh'
      - '.github/scripts/test-bsd-native.sh'
      - '.github/scripts/test-bsd-extended.sh'
      - '.github/scripts/test-bsd-interop.sh'
      - '.github/scripts/test-input-posix.sh'
      - 'Tools/ohos/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'Tools/crostini/**'
      - '.github/workflows/02-platforms.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      nixos_vm:
        description: 'Run real NixOS QEMU guest'
        type: boolean
        required: false
        default: false
      ohos_sdk:
        description: 'Run public native OpenHarmony SDK cross-compile'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: linux-distros-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portability-script-lint:
    name: Portability scripts / POSIX shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse hardware-side scripts without claiming hardware validation
        run: |
          set -eu
          for script in Tools/ohos/check-device.sh Tools/crostini/check-hardware.sh Tools/bsd/check-tty.sh; do
            sh -n "$script"
            echo "syntax PASS: $script"
          done

  openbsd:
    name: OpenBSD / portable + native C11
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945
        with:
          usesh: true
          run: |
            set -eu
            sh .github/scripts/test-portable-core.sh
            sh .github/scripts/test-bsd-native.sh
            sh .github/scripts/test-bsd-extended.sh
            sh .github/scripts/test-input-posix.sh
      - name: Report native module coverage
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f .build-bsd-extended/coverage.md ]; then
            cat .build-bsd-extended/coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'BSD report not generated; inspect the VM startup logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

  netbsd:
    name: NetBSD / portable + native C11
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92
        with:
          usesh: true
          run: |
            set -eu
            sh .github/scripts/test-portable-core.sh
            sh .github/scripts/test-bsd-native.sh
            sh .github/scripts/test-bsd-extended.sh
            sh .github/scripts/test-input-posix.sh
      - name: Report native module coverage
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f .build-bsd-extended/coverage.md ]; then
            cat .build-bsd-extended/coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'BSD report not generated; inspect the VM startup logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

  dragonflybsd:
    name: DragonFly BSD / portable + native C11
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@4ab776fa9f914fbea72f13715b451e77e7ef5c41
        with:
          usesh: true
          run: |
            set -eu
            sh .github/scripts/test-portable-core.sh
            sh .github/scripts/test-bsd-native.sh
            sh .github/scripts/test-bsd-extended.sh
            sh .github/scripts/test-input-posix.sh
      - name: Report native module coverage
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f .build-bsd-extended/coverage.md ]; then
            cat .build-bsd-extended/coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'BSD report not generated; inspect the VM startup logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

  distributions:
    name: ${{ matrix.name }} / native container C11
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: quay.io/fedora/fedora:latest
            install: dnf -y install gcc
          - name: Arch Linux
            image: archlinux:base-devel
            install: pacman -Syu --noconfirm --needed gcc
          - name: Void Linux glibc
            image: ghcr.io/void-linux/void-glibc:latest
            install: xbps-install -Sy -y gcc
          - name: Void Linux musl
            image: ghcr.io/void-linux/void-musl:latest
            install: xbps-install -Sy -y gcc
          - name: Debian (ChromeOS Crostini proxy)
            image: debian:stable-slim
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y gcc libc6-dev
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run portable tests
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.install }}
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" \
            /bin/sh -ec "$SETUP; sh .github/scripts/test-portable-core.sh; sh .github/scripts/test-linux-codec-minimal.sh"

  nix-toolchain:
    name: Nix-provided compiler (not a NixOS VM)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build locked Nix package (strict C11)
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            build '.#checks.x86_64-linux.portable' -L --no-write-lock-file
          nix --extra-experimental-features 'nix-command flakes' \
            build '.#checks.x86_64-linux.native' -L --no-write-lock-file

  nixos-vm:
    name: NixOS / QEMU actual guest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[portability-probe]')) || (github.event_name == 'workflow_dispatch' && inputs.nixos_vm) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Boot NixOS VM and run packaged C11 binaries
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            build '.#nixos-vm' -L --no-write-lock-file

  ohos-sdk:
    name: OpenHarmony / ARM64 SDK compile + link (no device)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[portability-probe]')) || (github.event_name == 'workflow_dispatch' && inputs.ohos_sdk) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install native OpenHarmony SDK 6.0
        id: sdk
        uses: openharmony-rs/setup-ohos-sdk@eb82b94ef522b07269679195c2512f22e922ef3b
        with:
          version: '6.0'
          components: native
          cache: 'true'
      - name: Compile & link OHOS C11
        env:
          OHOS_SDK: ${{ steps.sdk.outputs.ohos_sdk_native }}
          OHOS_ARCH: arm64-v8a
          OHOS_SYSTEM_PROBES: 'ON'
        run: sh Tools/ohos/check-portability.sh
      - name: Save target compiler diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ohos-native-target-diagnostics
          path: |
            .build-ohos/target-macros.txt
            .build-ohos/target-triple.txt
          if-no-files-found: ignore

  compatibility-summary:
    name: Compatibility / Summary
    if: ${{ always() }}
    needs: [openbsd, netbsd, dragonflybsd, distributions, nix-toolchain]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Summarize OS test results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPORT_TITLE: Platform Compatibility
        run: python3 .github/scripts/report-results.py
