name: 03 · Security

on:
  push:
    branches: [main, Alpha-Version]
  pull_request:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: Security / CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build selected C test suites
        if: ${{ matrix.language == 'c-cpp' }}
        run: sh .github/scripts/test-portable-core.sh
      - uses: github/codeql-action/analyze@v4

  privacy:
    name: Security / Repository privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check-privacy.py

  sanitizers:
    name: Security / ASan + UBSan / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Run manifest suites with sanitizers
        env:
          CC: ${{ matrix.cc }}
          PORTABLE_CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: sh .github/scripts/test-portable-core.sh

  gate:
    name: Security / Gate
    if: ${{ always() }}
    needs: [codeql, privacy, sanitizers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPORT_TITLE: Security
        run: python3 .github/scripts/report-results.py
