name: 02 · Platform Compatibility

on:
  push:
    branches: [main, Alpha-Version, pattern-refactor, audio-module]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            cc: gcc
          - name: Ubuntu Clang
            cc: clang
          - name: Alpine musl
            image: alpine:latest
          - name: Fedora
            image: quay.io/fedora/fedora:latest
          - name: Arch
            image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Run on native Ubuntu host
        if: ${{ !matrix.image }}
        env:
          CC: ${{ matrix.cc }}
        run: sh .github/scripts/test-portable-core.sh
      - name: Run in distribution container
        if: ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          DISTRO: ${{ matrix.name }}
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" /bin/sh -ec '
            case "$DISTRO" in
              "Alpine musl") apk add --no-cache gcc musl-dev ;;
              Fedora) dnf -y install gcc ;;
              Arch) pacman -Syu --noconfirm --needed gcc ;;
            esac
            CC=gcc sh .github/scripts/test-portable-core.sh
          '

  freebsd:
    name: BSD / FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          usesh: true
          run: sh .github/scripts/test-portable-core.sh

  macos:
    name: macOS / Clang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - name: Run manifest suites
        run: CC=clang sh .github/scripts/test-portable-core.sh

  windows:
    name: Windows / ${{ matrix.runner }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-latest]
        compiler: [mingw, msvc]
    steps:
      - uses: actions/checkout@v7
      - name: Run manifest suites with MinGW
        if: matrix.compiler == 'mingw'
        shell: bash
        run: sh .github/scripts/test-portable-core.sh
      - name: Configure MSVC
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Run manifest suites with MSVC
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: .github/scripts/test-msvc.ps1

  gate:
    name: Platform Compatibility / Gate
    if: ${{ always() }}
    needs: [linux, freebsd, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPORT_TITLE: Platform Compatibility
        run: python3 .github/scripts/report-results.py
