name: 02 · Platform Compatibility

on:
  push:
    branches: [main, Alpha-Version, pattern-refactor, audio-module]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      nixos_vm:
        description: 'Run the real NixOS QEMU guest VM'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian
            image: debian:stable-slim
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y gcc libc6-dev
          - name: Ubuntu GCC
            image: ubuntu:latest
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y gcc libc6-dev
          - name: Ubuntu Clang
            image: ubuntu:latest
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y clang libc6-dev
            cc: clang
          - name: Fedora
            image: quay.io/fedora/fedora:latest
            setup: dnf -y install gcc glibc-devel
          - name: Arch
            image: archlinux:base-devel
            setup: pacman -Syu --noconfirm --needed gcc
          - name: Void glibc
            image: ghcr.io/void-linux/void-glibc:latest
            setup: xbps-install -Sy -y gcc
          - name: Void musl
            image: ghcr.io/void-linux/void-musl:latest
            setup: xbps-install -Sy -y gcc
          - name: Alpine musl
            image: alpine:latest
            setup: apk add --no-cache gcc musl-dev linux-headers
          - name: openSUSE Tumbleweed
            image: registry.opensuse.org/opensuse/tumbleweed:latest
            setup: zypper --non-interactive refresh && zypper --non-interactive install gcc glibc-devel
          - name: Gentoo
            image: gentoo/stage3:latest
            setup: gcc --version
    steps:
      - uses: actions/checkout@v7
      - name: Install compiler and run manifest suites in ${{ matrix.name }}
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
          CC: ${{ matrix.cc || 'gcc' }}
        run: |
          docker run --rm -e SETUP -e CC -v "$PWD:/workspace" -w /workspace "$IMAGE" /bin/sh -ec '
            eval "$SETUP"
            command -v "$CC"
            "$CC" --version
            CC="$CC" sh .github/scripts/test-portable-core.sh
          '

  nix-toolchain:
    name: Nix / Flake toolchain (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Build the portable test package
        run: |
          nix --extra-experimental-features 'nix-command flakes'             build '.#checks.x86_64-linux.portable' -L --no-write-lock-file

  nixos-vm:
    name: NixOS / Real QEMU guest VM
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nixos_vm) }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Boot NixOS VM and execute the packaged C11 suites
        run: |
          nix --extra-experimental-features 'nix-command flakes'             build '.#nixos-vm' -L --no-write-lock-file

  freebsd:
    name: BSD / FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          usesh: true
          run: |
            set -eu
            sh .github/scripts/test-portable-core.sh
            sh .github/scripts/test-bsd-extended.sh

  openbsd:
    name: BSD / OpenBSD
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945
        with:
          usesh: true
          run: |
            set -eu
            sh .github/scripts/test-portable-core.sh
            sh .github/scripts/test-bsd-extended.sh

  netbsd:
    name: BSD / NetBSD
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92
        with:
          usesh: true
          run: |
            set -eu
            sh .github/scripts/test-portable-core.sh
            sh .github/scripts/test-bsd-extended.sh

  dragonflybsd:
    name: BSD / DragonFly BSD
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/dragonflybsd-vm@4ab776fa9f914fbea72f13715b451e77e7ef5c41
        with:
          usesh: true
          run: |
            set -eu
            sh .github/scripts/test-portable-core.sh
            sh .github/scripts/test-bsd-extended.sh

  macos:
    name: macOS / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon (ARM64)
            runner: macos-latest
          - name: Intel (x86_64)
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Run manifest suites with Apple Clang
        run: CC=clang sh .github/scripts/test-portable-core.sh

  windows:
    name: Windows / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows 10 / Server 2022 image
            runner: windows-2022
            compiler: MinGW
          - os: Windows 10 / Server 2022 image
            runner: windows-2022
            compiler: MSVC
          - os: Windows 11 / latest image
            runner: windows-latest
            compiler: MinGW
          - os: Windows 11 / latest image
            runner: windows-latest
            compiler: MSVC
    steps:
      - uses: actions/checkout@v7
      - name: Run manifest suites with MinGW
        if: matrix.compiler == 'MinGW'
        shell: bash
        run: sh .github/scripts/test-portable-core.sh
      - name: Configure MSVC
        if: matrix.compiler == 'MSVC'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Run manifest suites with MSVC
        if: matrix.compiler == 'MSVC'
        shell: pwsh
        run: .github/scripts/test-msvc.ps1

  gate:
    name: Platform Compatibility / Gate
    if: ${{ always() }}
    needs: [linux, nix-toolchain, nixos-vm, freebsd, openbsd, netbsd, dragonflybsd, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPORT_TITLE: Platform Compatibility
          ALLOW_SKIPPED: nixos-vm
        run: python3 .github/scripts/report-results.py
