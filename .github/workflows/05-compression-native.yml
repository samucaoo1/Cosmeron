name: "05 · Native Compression Validation"
on:
  push:
    branches: [compression-native, compression-native-integration, audio-module]
    paths:
      - "Codespace/Cosmeron/Modules/Compression/**"
      - "Codespace/Tests/Compression/**"
      - ".github/workflows/05-compression-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compression:
    name: "${{ matrix.name }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "GCC / Linux", os: ubuntu-latest, cc: gcc}
          - {name: "Clang / Linux", os: ubuntu-latest, cc: clang}
          - {name: "Clang / macOS", os: macos-latest, cc: clang}
    steps:
      - uses: actions/checkout@v4
      - name: Compression C11 and independent Python interop
        run: |
          make -C Codespace/Tests/Compression clean run interop zip64 CC=${{ matrix.cc }}
      - name: Native decoder sanitizers
        if: runner.os == 'Linux'
        run: |
          set -eu
          for test in NativeInflate NativeCodec Zip Allocation Robustness; do
            ${{ matrix.cc }} -std=c11 -Wall -Wextra -Wpedantic -Werror \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              "Codespace/Tests/Compression/$test.c" -o "/tmp/cosmeron-$test"
            "/tmp/cosmeron-$test"
          done

  windows-mingw:
    name: MinGW / Windows / C11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compression native and Python interop
        shell: bash
        run: make -C Codespace/Tests/Compression clean run interop zip64 CC=gcc

  windows-msvc:
    name: MSVC / Windows / C11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile native tests with MSVC
        shell: pwsh
        run: |
          foreach ($src in @("NativeInflate", "NativeCodec", "Zip", "Allocation", "Robustness")) {
            cl /nologo /std:c11 /W4 /WX /D_CRT_SECURE_NO_WARNINGS /TC "Codespace/Tests/Compression/$src.c" /Fe:"$src.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "./$src.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  freebsd:
    name: FreeBSD / Clang / native C11
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          usesh: true
          run: |
            set -eu
            for test in NativeInflate NativeCodec Zip Allocation Robustness Codec Zip; do
              cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
                "Codespace/Tests/Compression/$test.c" -o "./compression-$test"
              "./compression-$test"
            done

  openbsd:
    name: OpenBSD / native C11
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945
        with:
          usesh: true
          run: |
            set -eu
            for test in NativeInflate NativeCodec Zip Allocation Robustness Codec Zip; do
              cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
                "Codespace/Tests/Compression/$test.c" -o "./compression-$test"
              "./compression-$test"
            done

  netbsd:
    name: NetBSD / native C11
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92
        with:
          usesh: true
          run: |
            set -eu
            for test in NativeInflate NativeCodec Zip Allocation Robustness Codec Zip; do
              cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
                "Codespace/Tests/Compression/$test.c" -o "./compression-$test"
              "./compression-$test"
            done

  dragonflybsd:
    name: DragonFly BSD / native C11
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@4ab776fa9f914fbea72f13715b451e77e7ef5c41
        with:
          usesh: true
          run: |
            set -eu
            for test in NativeInflate NativeCodec Zip Allocation Robustness Codec Zip; do
              cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
                "Codespace/Tests/Compression/$test.c" -o "./compression-$test"
              "./compression-$test"
            done
