name: "06 · Native Audio Codec"
on:
  push:
    branches: [audio-native-codecs, audio-flac-native, audio-flac-frames, audio-flac-streaming, audio-mp3-native, audio-mp3-reservoir, audio-mp3-scalefactors, audio-mp3-huffman, audio-mp3-requantize, audio-mp3-hybrid, audio-mp3-imdct, audio-module]
    paths:
      - "Codespace/Cosmeron/Modules/Audio/**"
      - "Codespace/Tests/Audio/**"
      - ".github/workflows/06-audio-native-codec.yml"
  pull_request:
    paths:
      - "Codespace/Cosmeron/Modules/Audio/**"
      - "Codespace/Tests/Audio/**"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  native-wav:
    name: "${{ matrix.name }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "GCC Linux", os: ubuntu-latest, cc: gcc}
          - {name: "Clang Linux", os: ubuntu-latest, cc: clang}
          - {name: "Clang macOS", os: macos-latest, cc: clang}
    steps:
      - uses: actions/checkout@v4
      - name: Strict C11 Audio suite and codecless fallback
        run: make -C Codespace/Tests/Audio clean run CC=${{ matrix.cc }}
      - name: Zero-extra-link standalone native WAV
        run: |
          ${{ matrix.cc }} -std=c11 -Wall -Wextra -Wpedantic -Werror Codespace/Tests/Audio/NativeWAV.c -o /tmp/nativewav
          ${{ matrix.cc }} -std=c11 -Wall -Wextra -Wpedantic -Werror Codespace/Tests/Audio/WAVFormats.c -o /tmp/wavformats
          cd Codespace/Tests/Audio
          /tmp/nativewav
          /tmp/wavformats
  native-mp3-sanitizer:
    name: Linux / native MP3 UB + address sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native MP3 side-info and reservoir with sanitizers
        run: |
          set -eu
          cd Codespace/Tests/Audio
          for test in MP3Headers MP3SideInfo MP3Scalefactors MP3Huffman MP3Requant MP3Hybrid MP3IMDCT; do
            cc -std=c11 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer "$test.c" -o "/tmp/$test"
            "/tmp/$test"
          done
  windows-mingw:
    name: Windows MinGW / codec
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict C11 Audio suite (headless)
        shell: bash
        run: make -C Codespace/Tests/Audio clean run CC=gcc

  freebsd-flac:
    name: FreeBSD / native FLAC C11
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          usesh: true
          run: |
            set -eu
            cd Codespace/Tests/Audio
            for test in FLACMetadata FLACFrames FLACStandalone MP3Headers MP3SideInfo MP3Scalefactors MP3Huffman MP3Requant MP3Hybrid MP3IMDCT; do
              cc -std=c11 -Wall -Wextra -Wpedantic -Werror "$test.c" -o "./$test"
              "./$test"
            done
  windows-msvc-flac:
    name: Windows MSVC / native FLAC C11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: FLAC standalone strict C11 (no vendor backend)
        shell: pwsh
        run: |
          cd Codespace/Tests/Audio
          foreach ($test in @("FLACMetadata", "FLACFrames", "FLACStandalone", "MP3Headers", "MP3SideInfo", "MP3Scalefactors", "MP3Huffman", "MP3Requant", "MP3Hybrid", "MP3IMDCT")) {
            cl /nologo /std:c11 /W4 /WX /D_CRT_SECURE_NO_WARNINGS /TC "$test.c" "/Fe:$test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "./$test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
