name: "06 · Native Audio Codec"
on:
  push:
    branches: [audio-native-production, audio-native-codecs, audio-flac-native, audio-flac-frames, audio-flac-streaming, audio-mp3-native, audio-mp3-reservoir, audio-mp3-scalefactors, audio-mp3-huffman, audio-mp3-requantize, audio-mp3-hybrid, audio-mp3-imdct, audio-mp3-polyphase, audio-mp3-intensity, audio-mp3-experimental, audio-mp3-fidelity, audio-mp3-intensity-routing, audio-mp3-lsf, audio-mp3-lsf-pcm, audio-mp3-8k-huffman-regions, audio-mp3-lsf-intensity, audio-mp3-memory-stream, audio-mp3-reader-stream, audio-mp3-seek-optimization, audio-mp3-reader-robustness, audio-flac-overflow-guard, audio-mp3-id3-hardening, audio-mp3-mutation-fuzz, audio-mp3-mpeg1-intensity-parity, audio-module]
    paths:
      - "Codespace/Cosmeron/Modules/Audio/**"
      - "Codespace/Tests/Audio/**"
      - ".github/workflows/06-audio-native-codec.yml"
  pull_request:
    paths:
      - "Codespace/Cosmeron/Modules/Audio/**"
      - "Codespace/Tests/Audio/**"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  native-wav:
    name: "${{ matrix.name }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "GCC Linux", os: ubuntu-latest, cc: gcc}
          - {name: "Clang Linux", os: ubuntu-latest, cc: clang}
          - {name: "Clang macOS", os: macos-latest, cc: clang}
    steps:
      - uses: actions/checkout@v4
      - name: Strict C11 Audio suite and codecless fallback
        run: make -C Codespace/Tests/Audio clean run CC=${{ matrix.cc }}
      - name: Zero-extra-link standalone native WAV
        run: |
          ${{ matrix.cc }} -std=c11 -Wall -Wextra -Wpedantic -Werror Codespace/Tests/Audio/NativeWAV.c -o /tmp/nativewav
          ${{ matrix.cc }} -std=c11 -Wall -Wextra -Wpedantic -Werror Codespace/Tests/Audio/WAVFormats.c -o /tmp/wavformats
          cd Codespace/Tests/Audio
          /tmp/nativewav
          /tmp/wavformats
  mp3-parity-diagnostics:
    name: Linux / native MP3 multitone PCM residual (diagnostic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host-side MP3 fixture encoder (diagnostic only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Compare time-varying mono/stereo MP3 against miniaudio
        run: |
          cd Codespace/Tests/Audio
          sh MP3ParityFixtures.sh

  mp3-mpeg1-intensity-parity:
    name: Linux / independent MPEG-1 intensity stereo PCM parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original MPEG-1 intensity and MS+intensity frames
        run: |
          set -eu
          cd Codespace/Tests/Audio
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror MP3ExperimentalCompare.c -o /tmp/mp3-mpeg1-compare
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          python3 MP3MPEG1IntensityFixture.py "$dir/mono.mp3" 0 mono 32
          COSMERON_MP3_MPEG1_BASELINE_STRICT=1 /tmp/mp3-mpeg1-compare "$dir/mono.mp3"
          for ms in 0 1; do
            python3 MP3MPEG1IntensityFixture.py "$dir/baseline-$ms.mp3" "$ms" baseline 32
            COSMERON_MP3_MPEG1_BASELINE_STRICT=1 /tmp/mp3-mpeg1-compare "$dir/baseline-$ms.mp3"
            python3 MP3MPEG1IntensityFixture.py "$dir/intensity-$ms.mp3" "$ms" intensity 32
            if [ "$ms" -eq 1 ]; then
              COSMERON_MP3_MPEG1_INTENSITY_STRICT=1 COSMERON_MP3_REQUIRE_MS=1 /tmp/mp3-mpeg1-compare "$dir/intensity-$ms.mp3"
            else
              COSMERON_MP3_MPEG1_INTENSITY_STRICT=1 /tmp/mp3-mpeg1-compare "$dir/intensity-$ms.mp3"
            fi
          done

  mp3-lsf-intensity-parity:
    name: Linux / independently authored LSF intensity PCM parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate intensity bitstreams and verify PCM against miniaudio
        run: |
          set -eu
          cd Codespace/Tests/Audio
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror MP3ExperimentalCompare.c -o /tmp/mp3-lsf-is-compare
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          python3 MP3LSFIntensityFixture.py "$dir/mono.mp3" 0 0 mono
          COSMERON_MP3_BASELINE_STRICT=1 /tmp/mp3-lsf-is-compare "$dir/mono.mp3"
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror MP3Memory.c -o /tmp/mp3-memory-check
          /tmp/mp3-memory-check "$dir/mono.mp3"
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror MP3MemoryParity.c -o /tmp/mp3-memory-parity
          /tmp/mp3-memory-parity "$dir/mono.mp3"
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror CodecMP3Stream.c -o /tmp/mp3-stream-parity
          /tmp/mp3-stream-parity "$dir/mono.mp3"
          python3 MP3LSFIntensityFixture.py "$dir/baseline.mp3" 0 0 baseline
          COSMERON_MP3_BASELINE_STRICT=1 /tmp/mp3-lsf-is-compare "$dir/baseline.mp3"
          python3 MP3LSFIntensityFixture.py "$dir/baseline-short.mp3" 0 0 baseline-short
          COSMERON_MP3_BASELINE_STRICT=1 /tmp/mp3-lsf-is-compare "$dir/baseline-short.mp3"
          python3 MP3LSFIntensityFixture.py "$dir/baseline-mixed.mp3" 0 0 baseline-mixed
          COSMERON_MP3_BASELINE_STRICT=1 /tmp/mp3-lsf-is-compare "$dir/baseline-mixed.mp3"
          for ms in 0 1; do
            for scale in 0 1; do
              python3 MP3LSFIntensityFixture.py "$dir/intensity-$ms-$scale.mp3" "$ms" "$scale"
              COSMERON_MP3_LSF_INTENSITY_STRICT=1 /tmp/mp3-lsf-is-compare "$dir/intensity-$ms-$scale.mp3"
              python3 MP3LSFIntensityFixture.py "$dir/intensity-short-$ms-$scale.mp3" "$ms" "$scale" short
              COSMERON_MP3_LSF_INTENSITY_STRICT=1 /tmp/mp3-lsf-is-compare "$dir/intensity-short-$ms-$scale.mp3"
              python3 MP3LSFIntensityFixture.py "$dir/intensity-mixed-$ms-$scale.mp3" "$ms" "$scale" mixed
              COSMERON_MP3_LSF_INTENSITY_STRICT=1 /tmp/mp3-lsf-is-compare "$dir/intensity-mixed-$ms-$scale.mp3"
            done
          done

  flac-overflow-sanitizer:
    name: Linux / malformed FLAC ASan + UBSan regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutate native FLAC frames and verify arithmetic safety
        run: |
          set -eu
          cd Codespace/Tests/Audio
          for test in FLACArithmetic FLACRobustness FLACFrames; do
            clang -std=c11 -Wall -Wextra -Wpedantic -Werror -O1 -g \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              "$test.c" -o "/tmp/$test-flac-sanitized"
            "/tmp/$test-flac-sanitized"
          done

  mp3-mutational-fuzz:
    name: Linux / native MP3 libFuzzer + ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build header-only native MP3 fuzz target and corpus
        run: |
          set -eu
          cd Codespace/Tests/Audio
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror -O1 -g \
            -DCOSMERON_MP3_LIBFUZZER \
            -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
            MP3MutationFuzz.c -o /tmp/cosmeron-mp3-fuzz
          mkdir -p /tmp/cosmeron-mp3-corpus
          python3 - <<'PY'
          from pathlib import Path
          folder = Path("/tmp/cosmeron-mp3-corpus")
          mp3 = bytearray(417*4)
          for off in range(0, len(mp3), 417):
              mp3[off:off+4] = bytes((0xff,0xfb,0x90,0xc4))
          (folder/"mpeg1.mp3").write_bytes(mp3)
          (folder/"id3.mp3").write_bytes(b"ID3" + bytes((4,0,0,0,0,0,0)) + mp3)
          (folder/"short.mp3").write_bytes(mp3[:17])
          PY
          python3 MP3LSFIntensityFixture.py \
            /tmp/cosmeron-mp3-corpus/lsf-intensity.mp3 1 1 mixed
      - name: Deterministic mutations and guided fuzz iterations
        run: |
          set -eu
          cd Codespace/Tests/Audio
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            MP3MutationFuzz.c -o /tmp/cosmeron-mp3-mutations
          /tmp/cosmeron-mp3-mutations
          /tmp/cosmeron-mp3-fuzz \
            -runs=1200 -max_len=8192 -timeout=5 -rss_limit_mb=1024 \
            /tmp/cosmeron-mp3-corpus

  native-mp3-sanitizer:
    name: Linux / native MP3 UB + address sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native MP3 side-info and reservoir with sanitizers
        run: |
          set -eu
          cd Codespace/Tests/Audio
          for test in MP3Recovery MP3CRC DeviceNative PCMProduction NativeCodecProduction FLACIntegrity CodecRobustnessFuzz MP3Headers MP3ID3Readers MP3MutationFuzz MP3SideInfo MP3Scalefactors MP3ScalefactorsLSF MP3Huffman MP3HuffmanRegions MP3Requant MP3Hybrid MP3IMDCT MP3Synthesis MP3Intensity MP3JointStereo MP3JointStereoLSF MP3Xing MP3Experimental MP3MemorySmoke CodecMP3OptIn CodecMP3StreamSmoke CodecMP3ReaderFaults; do
            cc -std=c11 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer "$test.c" -o "/tmp/$test"
            "/tmp/$test"
          done
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer DeviceGuardTU_A.c DeviceGuardTU_B.c -o /tmp/device-guard-tu
          /tmp/device-guard-tu
  windows-mingw:
    name: Windows MinGW / codec
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict C11 Audio suite (headless)
        shell: bash
        run: make -C Codespace/Tests/Audio clean run CC=gcc

  freebsd-flac:
    name: FreeBSD / native FLAC C11
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          usesh: true
          run: |
            set -eu
            cd Codespace/Tests/Audio
            for test in MP3Recovery DeviceNative PCMProduction NativeCodecProduction MP3CRC FLACIntegrity CodecRobustnessFuzz FLACMetadata FLACFrames FLACArithmetic FLACStandalone MP3Headers MP3ID3Readers MP3MutationFuzz MP3SideInfo MP3Scalefactors MP3ScalefactorsLSF MP3Huffman MP3HuffmanRegions MP3Requant MP3Hybrid MP3IMDCT MP3Synthesis MP3Intensity MP3JointStereo MP3JointStereoLSF MP3Xing MP3Experimental MP3MemorySmoke CodecMP3OptIn CodecMP3StreamSmoke CodecMP3ReaderFaults; do
              cc -std=c11 -Wall -Wextra -Wpedantic -Werror "$test.c" -o "./$test"
              "./$test"
            done
            cc -std=c11 -Wall -Wextra -Wpedantic -Werror DeviceGuardTU_A.c DeviceGuardTU_B.c -o /tmp/device-guard-tu
            /tmp/device-guard-tu
  windows-msvc-flac:
    name: Windows MSVC / native FLAC C11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: FLAC standalone strict C11 (no vendor backend)
        shell: pwsh
        run: |
          cd Codespace/Tests/Audio
          foreach ($test in @("MP3Recovery", "DeviceNative", "PCMProduction", "NativeCodecProduction", "MP3CRC", "FLACIntegrity", "CodecRobustnessFuzz", "FLACMetadata", "FLACFrames", "FLACArithmetic", "FLACStandalone", "MP3Headers", "MP3MutationFuzz", "MP3SideInfo", "MP3Scalefactors", "MP3ScalefactorsLSF", "MP3Huffman", "MP3HuffmanRegions", "MP3Requant", "MP3Hybrid", "MP3IMDCT", "MP3Synthesis", "MP3Intensity", "MP3JointStereo", "MP3JointStereoLSF", "MP3Xing", "MP3Experimental", "MP3MemorySmoke", "CodecMP3OptIn", "CodecMP3StreamSmoke", "CodecMP3ReaderFaults")) {
            cl /nologo /std:c11 /W4 /WX /D_CRT_SECURE_NO_WARNINGS /TC "$test.c" "/Fe:$test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "./$test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          cl /nologo /std:c11 /W4 /WX /D_CRT_SECURE_NO_WARNINGS /TC DeviceGuardTU_A.c DeviceGuardTU_B.c /Fe:device-guard-tu.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./device-guard-tu.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native-interoperability:
    name: Linux / native codec production interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libflac12
      - name: Independent encoders, intensity layouts, VBR and nonseekable readers
        run: |
          cd Codespace/Tests/Audio
          sh NativeCodecInterop.sh
          cc -O2 -std=c11 -Wall -Wextra -Wpedantic -Werror MP3LargeReader.c -o /tmp/mp3-large
          /tmp/mp3-large
      - name: CPU and resident memory measurements (no threshold)
        run: |
          cd Codespace/Tests/Audio
          cc -O2 -std=c11 -Wall -Wextra -Wpedantic -Werror CodecBenchmark.c -o /tmp/codec-benchmark
          ffmpeg -nostdin -v error -y -f lavfi -i 'aevalsrc=0.2*sin(2*PI*(173*t+111*t*t)):s=44100:d=8' -c:a libmp3lame -q:a 4 /tmp/benchmark.mp3
          /tmp/codec-benchmark native /tmp/benchmark.mp3
          /tmp/codec-benchmark miniaudio /tmp/benchmark.mp3

  openbsd-native-devices:
    name: OpenBSD / native sndio headers and headless lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945
        with:
          usesh: true
          run: |
            set -eu
            cd Codespace/Tests/Audio
            for test in MP3Recovery DeviceNative PCMProduction NativeCodecProduction FLACIntegrity MP3CRC; do
              cc -std=c11 -Wall -Wextra -Wpedantic -Werror "$test.c" -o "/tmp/$test"
              "/tmp/$test"
            done
            cc -std=c11 -Wall -Wextra -Wpedantic -Werror DeviceGuardTU_A.c DeviceGuardTU_B.c -o /tmp/device-guard-tu
            /tmp/device-guard-tu

  netbsd-native-devices:
    name: NetBSD / native audioio headers and headless lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92
        with:
          usesh: true
          run: |
            set -eu
            cd Codespace/Tests/Audio
            for test in MP3Recovery DeviceNative PCMProduction NativeCodecProduction FLACIntegrity MP3CRC; do
              cc -std=c11 -Wall -Wextra -Wpedantic -Werror "$test.c" -o "/tmp/$test"
              "/tmp/$test"
            done
            cc -std=c11 -Wall -Wextra -Wpedantic -Werror DeviceGuardTU_A.c DeviceGuardTU_B.c -o /tmp/device-guard-tu
            /tmp/device-guard-tu

  dragonfly-native-devices:
    name: DragonFly / native OSS headers and headless lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@4ab776fa9f914fbea72f13715b451e77e7ef5c41
        with:
          usesh: true
          run: |
            set -eu
            cd Codespace/Tests/Audio
            for test in MP3Recovery DeviceNative PCMProduction NativeCodecProduction FLACIntegrity MP3CRC; do
              cc -std=c11 -Wall -Wextra -Wpedantic -Werror "$test.c" -o "/tmp/$test"
              "/tmp/$test"
            done
            cc -std=c11 -Wall -Wextra -Wpedantic -Werror DeviceGuardTU_A.c DeviceGuardTU_B.c -o /tmp/device-guard-tu
            /tmp/device-guard-tu
