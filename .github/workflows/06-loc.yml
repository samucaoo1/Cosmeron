name: Lines of Code

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Codespace/Cosmeron/**'
      - '.github/loc/**'
  pull_request:
    paths:
      - 'Codespace/Cosmeron/**'
      - '.github/loc/**'
  workflow_dispatch:

jobs:
  loc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run LOC counter
        run: python3 .github/loc/loc.py
      - name: Upload LOC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loc-badge
          path: |
            .github/loc/state.json
            .github/badges/loc.svg
