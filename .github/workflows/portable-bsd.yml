name: Portable BSD C11
on:
  push:
    branches: [main, audio-module]
    paths:
      - 'Codespace/**'
      - '.github/scripts/test-portable-core.sh'
      - '.github/workflows/portable-bsd.yml'
  pull_request:
    paths:
      - 'Codespace/**'
      - '.github/scripts/test-portable-core.sh'
      - '.github/workflows/portable-bsd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-bsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD / portable C11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          usesh: true
          run: sh .github/scripts/test-portable-core.sh

  openbsd:
    name: OpenBSD / portable C11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945
        with:
          usesh: true
          run: sh .github/scripts/test-portable-core.sh

  netbsd:
    name: NetBSD / portable C11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92
        with:
          usesh: true
          run: sh .github/scripts/test-portable-core.sh

  dragonflybsd:
    name: DragonFly BSD / portable C11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@4ab776fa9f914fbea72f13715b451e77e7ef5c41
        with:
          usesh: true
          run: sh .github/scripts/test-portable-core.sh
