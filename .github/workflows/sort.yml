name: Sort catalog
on:
  push:
    branches: [main, audio-module]
    paths:
      - 'Codespace/Cosmeron/Modules/Sort/**'
      - 'Codespace/Tests/Sort*.c'
      - '.github/workflows/sort.yml'
  pull_request:
    paths:
      - 'Codespace/Cosmeron/Modules/Sort/**'
      - 'Codespace/Tests/Sort*.c'
      - '.github/workflows/sort.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: gcc}
          - {os: ubuntu-latest, cc: clang}
          - {os: macos-latest, cc: clang}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Strict C11
        run: |
          for src in Codespace/Tests/Sort.c Codespace/Tests/SortCatalog.c; do
            "${{ matrix.cc }}" -std=c11 -Wall -Wextra -Wpedantic -Werror -I Codespace "$src" -o sort-test
            ./sort-test
          done
  mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          for src in Codespace/Tests/Sort.c Codespace/Tests/SortCatalog.c; do
            gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -I Codespace "$src" -o sort-test.exe
            ./sort-test.exe
          done
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - shell: pwsh
        run: |
          foreach ($src in @("Codespace/Tests/Sort.c", "Codespace/Tests/SortCatalog.c")) {
            cl /nologo /W4 /WX /TC /I Codespace $src /Fe:sort-test.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\sort-test.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
